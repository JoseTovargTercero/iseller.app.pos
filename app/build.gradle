plugins {
    id 'com.android.application'
}

// Clave de API del endpoint de rutas: se lee de local.properties (no versionado)
// o de la variable de entorno POS_API_KEY. Nunca se escribe en el código fuente.
def posApiKey = ""
def localProperties = rootProject.file("local.properties")
if (localProperties.exists()) {
    def props = new Properties()
    localProperties.withInputStream { props.load(it) }
    posApiKey = props.getProperty("POS_API_KEY", "")
}
if (!posApiKey) {
    posApiKey = System.getenv("POS_API_KEY") ?: ""
}
def posApiKeyLiteral = '"' + posApiKey.replace('\\', '\\\\').replace('"', '\\"') + '"'

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.iseller.pos"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        // Clave inyectada en tiempo de build (BuildConfig.POS_API_KEY). Ver local.properties.
        buildConfigField "String", "POS_API_KEY", posApiKeyLiteral

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/profile-installer-baseline-profile.prof'
            excludes += '/META-INF/profile-installer-dexmetadata.prof'
        }
    }
}

dependencies {
    // LibrerÃ­as base compatibles con SDK 33
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CORRECCIÃ“N AQUÃ: Bajada a la versiÃ³n 1.7.2 para que no pida SDK 35
    implementation 'androidx.activity:activity:1.7.2'

    // EscÃ¡ner de QR
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Otras dependencias estables
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.25'

    // Pruebas
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Un solo bloque de control al final para blindar el proyecto
configurations.all {
    resolutionStrategy {
        // Forzamos Material 1.6.0 para evitar errores de macros visuales antiguas
        force 'com.google.android.material:material:1.6.0'

        // Forzamos Profileinstaller antiguo para evitar que pida SDK superior
        force 'androidx.profileinstaller:profileinstaller:1.3.1'

        // Evitamos que librerÃ­as internas metan versiones de Core mÃ¡s nuevas que la API 33
        force 'androidx.core:core:1.9.0'
        force 'androidx.core:core-ktx:1.9.0'

        // Parche de Kotlin para evitar clases duplicadas
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.0'
            }
        }
    }
}