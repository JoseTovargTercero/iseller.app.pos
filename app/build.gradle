plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Clave de API del endpoint de rutas: se lee de local.properties (no versionado)
// o de la variable de entorno POS_API_KEY. Nunca se escribe en el c??digo fuente.
def posApiKey = ""
// Host del servidor. Se puede sobrescribir en local.properties (POS_BASE_URL=...)
// para probar contra el XAMPP local sin tocar el c??digo.
def posBaseUrl = "https://iseller-tiendas.com"
def posKeystore = ""
def posKeystorePass = ""
def posKeyAlias = ""
def posKeyPass = ""
def localProperties = rootProject.file("local.properties")
if (localProperties.exists()) {
    def props = new Properties()
    localProperties.withInputStream { props.load(it) }
    posApiKey = props.getProperty("POS_API_KEY", "")
    posBaseUrl = props.getProperty("POS_BASE_URL", posBaseUrl)
    posKeystore = props.getProperty("POS_KEYSTORE_FILE", "")
    posKeystorePass = props.getProperty("POS_KEYSTORE_PASSWORD", "")
    posKeyAlias = props.getProperty("POS_KEY_ALIAS", "")
    posKeyPass = props.getProperty("POS_KEY_PASSWORD", "")
}
if (!posApiKey) {
    posApiKey = System.getenv("POS_API_KEY") ?: ""
}
if (!posKeystorePass) {
    posKeystorePass = System.getenv("POS_KEYSTORE_PASSWORD") ?: ""
}
if (!posKeyPass) {
    posKeyPass = System.getenv("POS_KEY_PASSWORD") ?: ""
}
if (!posKeyAlias) {
    posKeyAlias = System.getenv("POS_KEY_ALIAS") ?: "iseller-pos"
}
// Sin keystore, el release queda sin firmar (no instalable).
def firmaConfigurada = posKeystore != "" && posKeystorePass != "" && posKeyAlias != ""
        && file(posKeystore).exists()
def posApiKeyLiteral = '"' + posApiKey.replace('\\', '\\\\').replace('"', '\\"') + '"'
def posBaseUrlLiteral = '"' + posBaseUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.iseller.pos"
        minSdk 24
        targetSdk 33
        versionCode 3
        versionName "1.2"

        // Clave inyectada en tiempo de build (BuildConfig.POS_API_KEY). Ver local.properties.
        buildConfigField "String", "POS_API_KEY", posApiKeyLiteral

        // Host del servidor (BuildConfig.POS_BASE_URL). Por defecto producci??n.
        buildConfigField "String", "POS_BASE_URL", posBaseUrlLiteral

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (firmaConfigurada) {
                storeFile file(posKeystore)
                storePassword posKeystorePass
                keyAlias posKeyAlias
                keyPassword posKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (firmaConfigurada) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/profile-installer-baseline-profile.prof'
            excludes += '/META-INF/profile-installer-dexmetadata.prof'
        }
    }
}

dependencies {
    // Librer????as base compatibles con SDK 33
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CORRECCI?????N AQU????: Bajada a la versi????n 1.7.2 para que no pida SDK 35
    implementation 'androidx.activity:activity:1.7.2'

    // Otras dependencias estables
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    // Material la usa transitivamente (viewpager2), as?? que se fija la versi??n ya cacheada.
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'com.android.volley:volley:1.2.1'

    // Notificaciones push (Firebase Cloud Messaging). Versi??n fijada: sigue siendo
    // compatible con compileSdk 33 (las 23.2+ exigen SDK 34).
    implementation 'com.google.firebase:firebase-messaging:23.1.2'

    // Pruebas
    testImplementation 'junit:junit:4.13.2'
    // org.json real para los tests de JVM: el android.jar de test solo trae stubs que lanzan
    // "not mocked", as?? que las clases que usan JSON no se pueden probar sin esto.
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Un solo bloque de control al final para blindar el proyecto
configurations.all {
    resolutionStrategy {
        // Forzamos Material 1.6.0 para evitar errores de macros visuales antiguas
        force 'com.google.android.material:material:1.6.0'

        // Forzamos Profileinstaller antiguo para evitar que pida SDK superior
        force 'androidx.profileinstaller:profileinstaller:1.3.1'

        // Evitamos que librer????as internas metan versiones de Core m????s nuevas que la API 33
        force 'androidx.core:core:1.9.0'
        force 'androidx.core:core-ktx:1.9.0'

        // Parche de Kotlin para evitar clases duplicadas
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.0'
            }
        }
    }
}